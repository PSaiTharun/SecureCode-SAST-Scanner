name: SAST

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  scan:
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      security-events: write      # lets the SARIF upload appear under Security > Code scanning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan this repository (samples/ and tests/ are intentionally vulnerable)
        run: python sast.py scan . --exclude samples,tests --format sarif --output reports/sast.sarif --exit-zero
      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true   # private repos without GitHub Advanced Security cannot ingest SARIF
        with:
          sarif_file: reports/sast.sarif
      - name: Keep the report as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sast-sarif
          path: reports/sast.sarif
      - name: Gate - fail on HIGH or CRITICAL findings
        run: python sast.py scan . --exclude samples,tests --fail-on high
